name: ci
on:
  push:
    branches:
      - main
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: echo "cache_id=$(date --utc +%V)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        with:
          key: mkdocs-material-${{ env.cache_id }}
          path: .cache
          restore-keys: |
            mkdocs-material-
      - run: pip install -r requirements.txt
      - run: mkdocs build
      - run: python3 scripts/check_docs.py --all
      - name: Copy source files for download
        run: |
          mkdir -p site/sources
          cp -r docs/* site/sources/
      - name: Package Claude mentor kit
        run: |
          mkdir -p /tmp/mentor-kit
          cp -r mentor-kit/. /tmp/mentor-kit/
          cp docs/ai-engineering/v2/langchain-path.md docs/ai-engineering/v2/ai-mastery-plan.md /tmp/mentor-kit/curriculum/
          (cd /tmp/mentor-kit && zip -qr "$GITHUB_WORKSPACE/site/mentor-kit.zip" .)
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'site'
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
